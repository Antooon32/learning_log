{% extends "learning_logs/base.html" %}

{% block container %}
    <p>Add a new topic:</p>

    <form action="{% url 'learning_logs:new_topic' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button name="submit" class="btn btn-lg btn-primary">Add topic</button>
    </form>

{% endblock container %}
