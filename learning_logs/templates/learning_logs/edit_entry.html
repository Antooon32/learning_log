{% extends "learning_logs/base.html" %}
{% load static %}

{% block container %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a></li>
            <li class="breadcrumb-item active">Edit entry</li>
        </ol>
    </nav>

    <form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post" class="mt-3">
        {% csrf_token %}
        
        <div class="form-group">
            {{ form.text }}
        </div>

        <button name="submit" class="btn btn-primary">Save changes</button>
    </form>
    
{% endblock container %}

{% block js_files %}
    <script src="{% static 'js/textarea_resizer.js' %}"></script>
{% endblock js_files %}
