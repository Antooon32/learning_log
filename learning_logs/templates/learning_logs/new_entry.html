{% extends "learning_logs/base.html" %}

{% block container %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a></li>
            <li class="breadcrumb-item active">Add a new entry</li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-md-10 col-lg-8"> <form action="{% url 'learning_logs:new_entry' topic.id %}" method="post" class="mt-3">
                {% csrf_token %}
                
                <div class="form-group">
                    {{ form.text }}
                </div>

                <button name="submit" class="btn btn-primary btn-lg">Add entry</button>
            </form>
        </div>
    </div>

{% endblock container %}
