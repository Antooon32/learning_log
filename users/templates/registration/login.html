{% extends "learning_logs/base.html" %}

{% block page_header %}
    <h2 class="login__title">Log in to your account</h2>
{% endblock page_header %}

{% block container %}
    <form method="post" action="{% url 'users:login' %}" class="login__form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" name="submit" class="login__button">Log in</button>
        <input type="hidden" name="next" value="{% url 'learning_logs:index' %}" />
    </form>
{% endblock container %}
